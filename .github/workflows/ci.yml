name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify CLI entrypoint
        run: ./bin/edge-anything.mjs --version
      - name: Run zero-dependency TypeScript test suite
        run: npm test
      - name: Run legacy-to-edge behavioral parity benchmark
        run: npm run benchmark
